name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: [self-hosted, linux, aplan]
    steps:
      # **Refusal, not redirection** (`A1-117`). A pull request has no business
      # publishing a release under any label, so the answer is that the job does
      # not run rather than that it runs somewhere else. Routing would keep it
      # reachable and merely move it; the property wanted is unreachability.
      #
      # `on:` already omits `pull_request`, so this is unreachable today. The
      # guard is here so that it stays unreachable if somebody later adds the
      # trigger, which is the edit this refusal exists to survive.
      - name: Refuse an untrusted event
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        run: |
          echo "refusing: ${{ github.event_name }} may not run the release workflow" >&2
          exit 1
      - run: echo "PROOF: release body reached on $RUNNER_NAME"

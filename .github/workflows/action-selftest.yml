name: Action self-test
on:
  push:
    branches: [main]
    paths: [action.yml, .github/workflows/action-selftest.yml]
  pull_request:
    branches: [main]
    paths: [action.yml, .github/workflows/action-selftest.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Self-test
    # **The refusal is a job condition, not a step** -- proved, not assumed.
    # Written as a step first, and the fork pull request showed why that is
    # wrong: a step cannot run until the job has been assigned a runner, so
    # the job sat queued against the box's label waiting for the box to pick
    # up untrusted work and refuse it. On a repository where that runner is
    # registered it would have been picked up. A job-level `if` is evaluated
    # before any assignment, so the job is skipped and never queued at all.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, aplan]
    steps:
      # **Refusal, not redirection.** Unlike the release workflow this one *is*
      # reachable by a fork pull request: its `on:` includes `pull_request` on
      # the paths a contributor editing the action would touch. It drives the
      # action against this repository's own release artefacts, which is the
      # same argument as the release workflow, so it refuses too.
      - run: |
          echo "PROOF: selftest body reached on $RUNNER_NAME"
